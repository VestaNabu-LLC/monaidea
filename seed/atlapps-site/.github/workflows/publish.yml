# Publishes atlapps.monaidea.com. The stamper of the Monaidea brand (repository
# VestaNabu-LLC/monaidea, folder brand/) builds the site from pages/: it adds
# the stylesheet, fonts, header, footer and scripts to every page, and GitHub
# Pages serves what it built (repository Settings > Pages > Source: GitHub
# Actions). When the stamper refuses a page the run stops there and the site
# stays as it was; the run's log lists every reason.
name: publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: VestaNabu-LLC/monaidea
          path: _brand
      - run: node --version
      - run: node _brand/brand/stamp.mjs . _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
