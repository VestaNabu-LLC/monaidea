# Publishes www.monaidea.com. The tests run, the stamper builds the site from
# pages/ and brand/, and GitHub Pages serves what it built (repository
# Settings > Pages > Source: GitHub Actions). When the stamper refuses a page
# the run stops there and the site stays as it was.
name: publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: node --version
      - run: node --test brand/stamp.test.mjs worker/test/index.test.mjs
      - run: node brand/stamp.mjs . _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
